# Despliegue de la base de datos (DV1 · ADR-0008).
# develop → Supabase staging (automático tras la fusión)
# main    → Supabase producción (requiere aprobación de equipo-qa en el entorno "production")
# Las migraciones y seeds los escribe equipo-datos por PR; ninguna persona aplica DDL a mano.
name: cd

on:
  push:
    branches: [develop, main]
    paths: ["supabase/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desplegar:
    name: desplegar / supabase
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      - name: Validar configuración del entorno
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            [ -n "${!v}" ] || { echo "::error::Falta $v en el entorno ${{ github.ref_name }}"; exit 1; }
          done
          [ -f supabase/config.toml ] || { echo "::error::Falta supabase/config.toml"; exit 1; }

      - name: Vincular proyecto
        run: npx --yes supabase@2 link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migraciones pendientes (simulación)
        run: npx --yes supabase@2 db push --dry-run --include-seed --password "$SUPABASE_DB_PASSWORD"

      - name: Aplicar migraciones y seeds
        run: npx --yes supabase@2 db push --include-seed --password "$SUPABASE_DB_PASSWORD"

      - name: Resumen
        if: always()
        run: echo "Despliegue de base · rama ${{ github.ref_name }} · commit ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
