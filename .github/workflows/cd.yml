# Despliegue de la base de datos (S0 · Datos · ADR-0008).
# develop → Supabase staging (automático) · main → producción (con aprobación de equipo-qa).
# Se conecta directo a PostgreSQL con SUPABASE_DB_URL: no usa token de administración de Supabase,
# y la misma forma sirve para la salida a AWS RDS.
name: cd

on:
  push:
    branches: [develop, main]
    paths: ["supabase/**", ".github/workflows/cd.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desplegar:
    name: desplegar / supabase
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Validar configuración del entorno
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::Falta SUPABASE_DB_URL en el entorno ${{ github.ref_name }}"; exit 1; }
          [ -f supabase/config.toml ] || { echo "::error::Falta supabase/config.toml"; exit 1; }

      - name: Migraciones pendientes (simulación)
        run: npx --yes supabase@2 db push --db-url "$SUPABASE_DB_URL" --include-seed --dry-run

      - name: Aplicar migraciones y seeds
        run: npx --yes supabase@2 db push --db-url "$SUPABASE_DB_URL" --include-seed

      - name: Resumen
        if: always()
        run: echo "Despliegue de base · rama ${{ github.ref_name }} · commit ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
